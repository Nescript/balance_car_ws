# 这里的命名必须与 launch 文件中 controller_spawner 的参数一致
balance_controller:
  type: "balance_controller/BalanceController" # 需替换为您代码中实现的实际插件类名
  # 平衡环 (内环)：输入为俯仰角误差 (rad)，输出为力矩 (Nm)
  balance_pid:
    p: 5
    i: 0
    d: 0.3
    i_clamp: 10.0

  # 速度环 (外环)：输入为速度误差 (m/s)，输出为目标俯仰角 (rad)
  # P 值不宜过大，否则会导致角度剧烈波动
  velocity_pid:
    p: 0.07
    i: 0.001
    d: 0.0
    i_clamp: 0.03

  # 转向环：输入为角速度误差 (rad/s)，输出为两侧电机的差分力矩 (Nm)
  yaw_pid:
    p: 0.5
    i: 0.0
    d: 100
    i_clamp: 1.0

  gimbal_pitch_pid:
    p: 5
    i: 0.0
    d: 100
    i_clamp: 1.0

  gimbal_yaw_pid:
    p: 1
    i: 0.0
    d: 10
    i_clamp: 1.0

  position_pid:
    p: 0.5
    i: 0.0
    d: 0.01
    i_clamp: 1.0
  # 物理参数：必须与 URDF 中的模型尺寸保持一致
  wheel_separation: 0.53
  wheel_radius: 0.1
  k1: -22.3607
  k2: -13.2873 
  k3: -41.7910 
  k4: -7.7452

  l1: 0.15
  l2: 0.07
  l3: 0.15
  l4: 0.07
  l5: 0.0

  # 腿部关节位置 PID（输入：angle error rad，输出：effort Nm）
  l1_pid:
    p: 5.0
    i: 0.0
    d: 0.5
    i_clamp: 2.0

  l4_pid:
    p: 5.0
    i: 0.0
    d: 0.5
    i_clamp: 2.0

  # 正弦轨迹参数
  # IK 坐标系以 hip_joint 为原点，y 轴向下为负
  # 可达范围：|l1-l2|=0.08 m  ~  l1+l2=0.22 m
  traj_x_center:     0.0     # x 方向中心 (m)
  traj_y_center:    -0.17    # y 方向中心 (m)，hip 正下方 17 cm，处于可达区中部
  traj_x_amplitude:  0.02    # x 振幅 (m)，±2 cm
  traj_y_amplitude:  0.02    # y 振幅 (m)，±2 cm
  traj_frequency:    0.3     # 频率 (Hz)，较慢便于 PID 跟踪
  traj_sine_periods: 2       # y 方向正弦半周期数

  k1_selfup: -2.2361
  k2_selfup: -2.7418
  k3_selfup: -17.9637 
  k4_selfup: -4.3165
# 同时也需要配置 joint_state_controller
joint_state_controller:
  type: "joint_state_controller/JointStateController"
  publish_rate: 50

# PositionJointInterface 底层 PID（gazebo_ros_control 读取，根命名空间下）
# 格式：<joint_name>/pid: {p, i, d}
left_hip_joint:
  pid: {p: 8.0, i: 0.5, d: 8.0}
right_hip_joint:
  pid: {p: 8.0, i: 0.5, d: 8.0}
left_linkage_2_joint:
  pid: {p: 8.0, i: 0.5, d: 8.0}
right_linkage_2_joint:
  pid: {p: 8.0, i: 0.5, d: 8.0}
