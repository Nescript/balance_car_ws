joint_state_controller:
  type: "joint_state_controller/JointStateController"
  publish_rate: 50

left_wheel_effort_controller:
  type: "effort_controllers/JointEffortController"
  joint: left_wheel_joint

right_wheel_effort_controller:
  type: "effort_controllers/JointEffortController"
  joint: right_wheel_joint

/gazebo_ros_control/pid_gains:
  left_hip_joint:       {p: 80.0, i: 0.5, d: 8.0}
  right_hip_joint:      {p: 80.0, i: 0.5, d: 8.0}
  left_linkage_2_joint: {p: 80.0, i: 0.5, d: 8.0}
  right_linkage_2_joint: {p: 80.0, i: 0.5, d: 8.0}